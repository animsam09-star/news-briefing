name: telegram-check

# Telegram 연결만 확인한다 — 브리핑을 태우지 않고 토큰·chat_id·전달 가능 여부를 본다.
#
# 브리핑 잡이 초록색인데 메시지가 안 오는 상황(2026-08-14)에서 원인을 가르기 위한 도구다.
# 잡 성공 = "Claude가 발송본을 만들었다"일 뿐, "Telegram이 받았다"가 아니었다.
#
# getUpdates 비교가 핵심이다. sendMessage 가 ok 를 돌려주는데도 사용자에게 안 보인다면
# 남은 가능성은 "설정된 chat_id 가 사용자가 보고 있지 않은 방을 가리킨다"뿐이다.
# 실행 직전에 봇에게 아무 메시지나 보내두면, 그 대화가 getUpdates 에 잡히므로
# 설정값과 대조해 일치/불일치를 판정할 수 있다.
#
# 로그는 public 이므로 응답 원문을 절대 찍지 않는다 — getMe 에는 봇 계정, sendMessage
# 성공 응답에는 수신자 이름과 chat_id 가 들어 있다. 판정과 마스킹한 id 만 남기고,
# 값 자체가 필요할 때만 reveal_chat_id 로 명시적으로 연다.
#
# 참고: TELEGRAM_CHAT_ID 는 시크릿이라 reveal 을 켜도 GitHub 이 로그에서 *** 로 가린다.
# 정작 필요한 값은 getUpdates 가 찾아낸 후보 id 쪽이고, 그건 시크릿이 아니라 그대로 보인다.

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: '실제로 테스트 메시지 1건을 보낸다'
        type: boolean
        default: true
      reveal_chat_id:
        description: 'chat_id 를 가리지 않고 그대로 출력한다 (로그가 공개된다는 점 주의)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 토큰·chat 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test_message }}
          REVEAL: ${{ inputs.reveal_chat_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then echo "::error::TELEGRAM_BOT_TOKEN 시크릿이 비어 있다"; exit 1; fi
          if [ -z "${TELEGRAM_CHAT_ID}" ]; then echo "::error::TELEGRAM_CHAT_ID 시크릿이 비어 있다"; exit 1; fi

          # 응답 원문 대신 판정만 출력. 인자: 호출 이름. 표준입력: 응답 본문.
          cat > /tmp/verdict.py <<'PY'
          import json, sys
          name = sys.argv[1]
          try:
              r = json.load(sys.stdin)
          except Exception:
              print(f"{name}: JSON 아닌 응답 — Telegram API 장애 가능")
              sys.exit(1)
          if r.get("ok"):
              print(f"{name}: ok")
              sys.exit(0)
          print(f"{name}: 거부됨 (error_code {r.get('error_code', '?')}) — {r.get('description', '(설명 없음)')}")
          sys.exit(1)
          PY

          # getUpdates 에 잡힌 대화들을 설정된 chat_id 와 대조한다.
          # 이름·username 은 출력하지 않는다. type 과 (기본적으로) 마스킹한 id 만 남긴다.
          cat > /tmp/whereto.py <<'PY'
          import json, os, sys

          def mask(v):
              s = str(v)
              sign, digits = ("-", s[1:]) if s.startswith("-") else ("", s)
              if len(digits) <= 4:
                  return sign + "*" * len(digits)
              return f"{sign}{digits[:2]}{'*' * (len(digits) - 4)}{digits[-2:]}"

          reveal = os.environ.get("REVEAL") == "true"
          show = (lambda v: str(v)) if reveal else mask
          want = os.environ["TELEGRAM_CHAT_ID"].strip()

          try:
              r = json.load(sys.stdin)
          except Exception:
              print("getUpdates: JSON 아닌 응답 — 판정 불가")
              sys.exit(0)
          if not r.get("ok"):
              print(f"getUpdates: 거부됨 — {r.get('description', '(설명 없음)')}")
              sys.exit(0)

          seen = {}
          for u in r.get("result", []):
              for key in ("message", "edited_message", "channel_post", "my_chat_member"):
                  chat = (u.get(key) or {}).get("chat")
                  if chat:
                      seen[str(chat.get("id"))] = chat.get("type", "?")

          if not seen:
              print("getUpdates: 최근 24시간 안에 봇에게 온 메시지가 없다 "
                    "— 봇에게 아무 말이나 보낸 뒤 다시 실행하면 대조할 수 있다")
              print(f"설정된 chat_id: {show(want)}")
              sys.exit(0)

          print(f"getUpdates: 최근 대화 {len(seen)}개 확인")
          for cid, ctype in seen.items():
              mark = "← 설정값과 일치" if cid == want else ""
              print(f"  - type={ctype} id={show(cid)} {mark}".rstrip())

          if want in seen:
              print("판정: 설정된 chat_id 가 실제로 봇과 대화 중인 방이다. 발송 대상은 맞다.")
          else:
              print(f"판정: 설정된 chat_id({show(want)}) 가 위 목록에 없다 "
                    "— 브리핑이 지금 보고 계신 방이 아닌 다른 방으로 가고 있다는 뜻이다.")
              print("      위 목록에서 받고 싶은 방을 고른 뒤 그 id 로 TELEGRAM_CHAT_ID 시크릿을 바꾸면 된다.")
              if not reveal:
                  print("      id 원문이 필요하면 reveal_chat_id 를 켜고 다시 실행할 것.")
          PY

          rc=0

          resp=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe") \
            || resp='{"ok":false,"description":"curl 실패"}'
          printf '%s' "$resp" | python3 /tmp/verdict.py getMe || rc=1

          resp=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat" \
            -d "chat_id=${TELEGRAM_CHAT_ID}") || resp='{"ok":false,"description":"curl 실패"}'
          printf '%s' "$resp" | python3 /tmp/verdict.py getChat || rc=1

          if [ "${SEND_TEST}" = "true" ]; then
            printf '%s\n' "브리핑 봇 연결 확인 — 이 메시지가 보이면 발송 경로는 정상입니다." > /tmp/ping.txt
            resp=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@/tmp/ping.txt") \
              || resp='{"ok":false,"description":"curl 실패"}'
            printf '%s' "$resp" | python3 /tmp/verdict.py sendMessage || rc=1
          fi

          echo "─────────────────────────────"
          resp=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=100") \
            || resp='{"ok":false,"description":"curl 실패"}'
          printf '%s' "$resp" | python3 /tmp/whereto.py

          if [ "$rc" -ne 0 ]; then
            echo "::error::Telegram 경로 이상 — 위 사유 확인 (토큰 재발급·chat_id 변경·봇 차단 등)"
          fi
          exit $rc
