name: news-briefing

# 정시 발송은 외부 스케줄러가 workflow_dispatch로 정각에 쏘는 것이 1차 경로.
# 아래 schedule은 그 백업 — GitHub cron은 정시 보장이 없어 수십 분~수 시간 지연되므로
# (실측 최대 +3시간 23분), 같은 슬롯이 이미 dispatch로 발송됐으면 가드가 생략시킨다.
run-name: "briefing ${{ inputs.slot || github.event.schedule }}"

on:
  schedule:
    # KST = UTC+9. GitHub cron은 UTC 기준. KST 토요일은 발송 생략 (토요일 뉴스는 월요일 morning의 주말 윈도우가 커버).
    # morning은 전날 UTC에 실행되므로 KST 토요일 제외 = UTC 금요일(5) 제외.
    - cron: '20 21 * * 0-4,6'   # morning    06:20 KST, 일~금 (KST 토 제외)
    - cron: '0 1 * * 0-5'       # midmorning 10:00 KST, 일~금
    - cron: '40 5 * * 0-5'      # afternoon  14:40 KST, 일~금 (발송 완료 ~14:52 — '3시까지' 지침)
    - cron: '30 12 * * 0-5'     # evening    21:30 KST, 일~금
  workflow_dispatch:
    inputs:
      slot:
        description: '브리핑 슬롯'
        required: true
        type: choice
        options: [morning, midmorning, afternoon, evening]

permissions:
  contents: write   # state/sent.json (슬롯 간 중복 차단 이력) 커밋
  actions: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 발송 이력 커밋 시 rebase 재시도가 가능하도록 전체 히스토리

      - name: 슬롯 결정 (cron → slot 매핑)
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "20 21 * * 0-4,6") SLOT=morning ;;
            "0 1 * * 0-5")     SLOT=midmorning ;;
            "40 5 * * 0-5")    SLOT=afternoon ;;
            "30 12 * * 0-5")   SLOT=evening ;;
            *)                 SLOT="${{ inputs.slot }}" ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "선택된 슬롯: $SLOT"

      # 지연 도착한 schedule 실행이 dispatch가 이미 보낸 슬롯을 또 보내지 않게 한다.
      # 같은 슬롯은 하루 1회뿐이고 슬롯 간 최소 간격이 3시간 40분이므로 6시간 창이면 충분.
      # 조회 실패 시에는 발송하는 쪽으로 폴백(미발송보다 중복이 낫다).
      - name: 중복 발송 가드 (schedule 전용)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          CUTOFF=$(date -u -d '6 hours ago' '+%Y-%m-%dT%H:%M:%S+00:00')
          DONE=$(gh run list -R "$GITHUB_REPOSITORY" -w briefing.yml \
            --created ">=$CUTOFF" --json displayTitle,status,conclusion \
            -q "[.[] | select(.displayTitle == \"briefing $SLOT\")
                     | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")] | length" || echo 0)
          if [ "${DONE:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "슬롯 $SLOT 은 이미 정시 dispatch로 발송됨 — 지연 스케줄 실행 생략"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: 기사 풀 수집 (네이버 API + Google News RSS)
        if: steps.guard.outputs.skip != 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect.py --slot "${{ steps.slot.outputs.slot }}" --out pool.json

      # npm 이 패키지는 깔았는데 플랫폼 네이티브 바이너리가 안 딸려오는 경우가 있다.
      # 2026-08-20 midmorning 이 그랬다 — npm install 은 성공했는데 claude 를 실행하니
      # "claude native binary not installed" 로 즉시 죽었고, 그 슬롯은 통째로 누락됐다.
      # postinstall 을 다시 돌려도 같은 자리에서 멈춘다:
      #   Native package "@anthropic-ai/claude-code-linux-x64" not found.
      # 즉 옵셔널 의존성이 아예 안 받아진 상태라, 재실행이 아니라 다른 경로가 필요하다.
      #
      # 세 단계로 내려간다. 설치했다고 넘어가지 말고 매 단계마다 실제로 실행되는지 본다.
      #   1) 평소대로 npm 전역 설치
      #   2) 안 되면 플랫폼 패키지를 직접 지정해 설치
      #   3) 그래도 안 되면 패키지가 안내하는 cli-wrapper.cjs(순수 JS 경로)로 shim 을 만들어
      #      PATH 앞에 끼운다 — 이후 스텝은 그대로 `claude` 를 부르면 된다
      # 셋 다 실패하면 여기서 잡을 실패시킨다. 선별 스텝까지 끌고 가서 죽는 것보다
      # 원인이 훨씬 빨리 보인다.
      - name: Claude Code 설치
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          if claude --version; then
            echo "네이티브 바이너리 정상"
            exit 0
          fi

          echo "::warning::네이티브 바이너리 없음 — 플랫폼 패키지를 직접 설치해 본다"
          npm install -g @anthropic-ai/claude-code-linux-x64 || true
          if claude --version; then
            echo "플랫폼 패키지 직접 설치로 복구됨"
            exit 0
          fi

          echo "::warning::플랫폼 패키지도 실패 — cli-wrapper.cjs 폴백으로 전환한다"
          ROOT="$(npm root -g)/@anthropic-ai/claude-code"
          WRAPPER="$ROOT/cli-wrapper.cjs"
          if [ ! -f "$WRAPPER" ]; then
            echo "::error::cli-wrapper.cjs 가 없다 — 패키지 구조가 예상과 다르다"
            ls -la "$ROOT" || true
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          {
            echo '#!/usr/bin/env bash'
            echo "exec node \"$WRAPPER\" \"\$@\""
          } > "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          # GITHUB_PATH 는 다음 스텝부터 적용된다 — 선별 스텝이 이 shim 을 집는다.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          if "$HOME/.local/bin/claude" --version; then
            echo "cli-wrapper 폴백으로 복구됨"
            exit 0
          fi
          echo "::error::claude 설치 실패 — 네이티브 바이너리·플랫폼 패키지·JS 폴백 모두 실패"
          exit 1

      - name: 브리핑 선별·작성 (Claude 헤드리스 → out/msg*.txt)
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 세션이 일을 백그라운드로 넘기면 기본 600초 상한에서 잘려 죽는다.
          # 2026-08-24 midmorning 이 그랬다 — "백그라운드 에이전트에 위임했습니다"로
          # 응답이 끝났고 out/ 은 비어 있었다. 프롬프트에서 위임을 금지했지만,
          # 그래도 백그라운드가 생기면 잘리지 말고 끝까지 기다리게 한다.
          # 무한 대기가 되진 않는다 — 잡의 timeout-minutes: 30 이 상한이다.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
        run: |
          claude -p "$(cat "prompts/${{ steps.slot.outputs.slot }}.md")" \
            --dangerously-skip-permissions \
            --model claude-sonnet-5

      # 발송은 워크플로가 직접 한다.
      #
      # 왜: `claude -p`는 최종 응답 텍스트만 stdout에 내보내므로, 세션 안에서 쏜 curl의
      # 응답은 Actions 로그에 남지 않는다. 그래서 Telegram이 메시지를 거부해도 잡은
      # 초록색으로 끝나고 아무도 모른다 — 2026-08-14에 실제로 그렇게 됐다(morning 잡
      # success, msg1~5.txt 정상 생성, 사용자에게는 아무것도 도착하지 않음).
      # 여기서 쏘면 응답의 ok 값을 워크플로가 직접 검사할 수 있고, 거부 사유(description)가
      # 로그에 남으며, 실패가 잡 실패로 드러나 감시견이 재시도할 수 있다.
      - name: Telegram 발송 (응답 ok 검증)
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          shopt -s nullglob
          files=(out/msg*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::out/msg*.txt 없음 — 보낼 내용이 없다 (프롬프트가 발송본을 쓰지 않았음)"
            exit 1
          fi
          # msg10 이 msg2 보다 앞서지 않도록 숫자 정렬
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -V)

          failed=0
          for f in "${files[@]}"; do
            sent=0
            for attempt in 1 2 3; do
              resp=$(curl -sS --max-time 30 \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text@${f}") || resp='{"ok":false,"description":"curl 실패(네트워크/타임아웃)"}'
              if printf '%s' "$resp" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("ok") else 1)' 2>/dev/null; then
                echo "$f 발송 완료 ($(wc -c < "$f") bytes)"
                sent=1
                break
              fi
              # 응답 원문은 찍지 않는다 — sendMessage 성공 응답에는 chat 정보(이름·chat_id)가
              # 들어 있고 이 저장소는 public 이라 로그가 그대로 공개된다. description 만 남긴다.
              why=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("description","(설명 없음)"))' 2>/dev/null || echo "JSON 아닌 응답 — Telegram API 장애 가능")
              echo "::warning::$f 발송 실패 ($attempt/3) — $why"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            [ "$sent" -eq 1 ] || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Telegram 발송 실패 — 위 경고의 사유 확인 (토큰 만료·chat_id 변경·봇 차단 등)"
            exit 1
          fi

      # 발송본을 눈으로 확인할 수 있게 워크플로가 직접 출력한다(세션 안 cat은 로그에 안 남음).
      - name: 실제 발송본 출력 (형식 사후 검증)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          shopt -s nullglob
          files=(out/msg*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::out/msg*.txt 없음 — 발송본을 확인할 수 없다 (프롬프트가 out/ 에 쓰지 않았음)"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "───────── $f ─────────"
            cat -- "$f"
            echo
          done

      # 이번 슬롯이 발송한 기사를 이력에 남긴다 → 다음 슬롯의 collect.py가 수집 단계에서 제외.
      # 프롬프트가 out/sent.json 을 남기지 못했으면 경고만 하고 통과(fail-open).
      - name: 발송 이력 기록 (슬롯 간 중복 차단)
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/record_sent.py --slot "${{ steps.slot.outputs.slot }}" --in out/sent.json

      - name: 발송 이력 커밋
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          if git diff --cached --quiet; then
            echo "이력 변화 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(state): ${{ steps.slot.outputs.slot }} 발송 이력 갱신 [skip ci]"
          # 다른 슬롯이 그 사이 커밋했을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git push && exit 0
            echo "push 실패 — origin 변경분 rebase 후 재시도 ($i/3)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          echo "::warning::발송 이력 push 실패 — 다음 슬롯에서 중복이 늘어날 수 있음"

      - name: 수집 풀·발송본 아카이브 (디버깅용, 7일 보관)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pool-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: |
            pool.json
            out/
          retention-days: 7
          if-no-files-found: ignore
